name: ci

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database:
    name: migrazioni e RLS (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinnata come la devDependency `supabase` in package.json: "latest"
          # scarica una release diversa a ogni run (rate limit di GitHub) e
          # può cambiare comportamento senza che il repo cambi.
          version: 2.122.1
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          # In CI il reporter è `github`: `playwright-report/` non viene
          # generato, le tracce dei retry stanno in `test-results/`.
          path: test-results/
          retention-days: 7

  e2e-backend:
    name: Playwright (backend locale)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Stack e dati demo: `db reset` applica migrazioni e seed. Gli utenti Auth
      # demo li crea `scripts/e2e-backend-prepare.mjs`, dentro `npm run
      # test:e2e:backend`, che poi compila e serve l'app sulla porta 4174.
      - run: supabase start
      - run: supabase db reset
      - run: npm run test:e2e:backend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-backend-traces
          path: test-results/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
